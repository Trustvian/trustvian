# Quality gates for every module and boundary a Trustvian release depends
# on. These are the same checks this project has run by hand on every task
# since v0.1 (see CONTRIBUTING.md and the Makefile) — this workflow makes
# them automatic rather than a matter of discipline.
#
# Publishing is deliberately NOT here. This workflow creates no release,
# image, or artifact, which is why it can run with read-only permissions
# and needs no secrets at all. Release and supply-chain work are separate
# workflows in later v0.9 slices.
#
# See docs/tasks/039-ci-quality-gate-automation.md.

name: CI

on:
  push:
    # `develop` is where work actually lands; `main` receives it by pull
    # request at release time. Watching only `main` — as the previous
    # workflow did — meant CI first reported at the moment of release.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only. This workflow publishes nothing, so it needs no write scope
# anywhere. A fork pull request therefore cannot obtain credentials,
# because the job has none to obtain.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Root module: the engine, CLI, and public API.
  # ---------------------------------------------------------------------
  root:
    name: Root module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # PostgreSQL for the v0.8 persistence guarantees. The integration
      # tests skip themselves when TRUSTVIAN_TEST_POSTGRES_DSN is unset, so
      # providing it here is what turns them on — no test is modified and
      # no second gating mechanism is introduced.
      #
      # These credentials are ephemeral and scoped to this job. They are
      # not secrets and must never be replaced by one: a workflow that
      # needs a real DSN could not run on fork pull requests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          POSTGRES_PASSWORD: trustvian
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        # Readiness, not a sleep: the job starts when PostgreSQL says it
        # is ready to accept connections.
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, without the cost of full history. scripts/check-modules.sh
          # verifies that each module's declared root version is real, and a
          # local tag answers that offline; without tags it falls back to
          # querying the module proxy on every run. checkout fetches no tags
          # by default, which is exactly why this check failed in CI while
          # passing locally.
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          # From go.mod, so the CI toolchain cannot drift from the version
          # the module itself declares.
          go-version-file: go.mod
          cache: true

      - name: Format
        # gofmt -l prints offending files and exits 0, so the exit status
        # alone proves nothing — the output is the signal.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Module consistency
        # Catches module drift on the pull request that introduces it,
        # rather than during a release. See scripts/check-modules.sh.
        run: ./scripts/check-modules.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Go vulnerability scan
        # Symbol-level reachability, not just "a vulnerable module is in the
        # graph": this repository's processor carries advisories its code
        # cannot reach, which a graph-only scanner would report as findings
        # to triage. Run via `go run` so no tool is added to the module's
        # dependencies.
        #
        # GOWORK=off explicitly. go.work is gitignored, so it exists on
        # developer machines and not here; with it active, MVS raises this
        # module's dependency versions to satisfy the other workspace
        # members, which can hide a vulnerability that a real consumer of
        # this module alone would be exposed to. The module's own build list
        # is the one that matters.
        env:
          GOWORK: "off"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test with PostgreSQL
        # -short runs the integration tier but skips the expensive stress
        # tier, which is scheduled nightly instead (see nightly.yml and the
        # tier table in docs/tasks/039-ci-quality-gate-automation.md).
        env:
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:trustvian@localhost:5432/trustvian_test?sslmode=disable
        run: go test -race -short ./...

  # ---------------------------------------------------------------------
  # Processor module: a separate Go module that resolves the core module
  # through a replace directive. GOWORK=off is the point of this job — a
  # workspace would mask a broken module boundary, and this module's
  # buildability outside the workspace is release-critical.
  # ---------------------------------------------------------------------
  processor:
    name: Processor module (GOWORK=off)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: processor/go.mod
          cache: true
          cache-dependency-path: processor/go.sum

      - name: Format
        working-directory: processor
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: processor
        run: go vet ./...

      - name: Build
        working-directory: processor
        run: go build ./...

      - name: Test
        working-directory: processor
        run: go test ./...

      - name: Race
        working-directory: processor
        run: go test -race ./...

      - name: Go vulnerability scan
        working-directory: processor
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ---------------------------------------------------------------------
  # Examples module: also separate, and the repository's proof that the
  # public API is usable from outside. Run with GOWORK=off for the same
  # reason as the processor — an external consumer has no workspace.
  # ---------------------------------------------------------------------
  examples:
    name: Examples module (GOWORK=off)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go.mod
          cache: true
          cache-dependency-path: examples/go.sum

      - name: Format
        working-directory: examples
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: examples
        run: go vet ./...

      - name: Build
        working-directory: examples
        run: go build ./...

      - name: Test
        working-directory: examples
        run: go test ./...

      - name: Go vulnerability scan
        working-directory: examples
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: No internal imports
        # examples/ exists to prove the public API is sufficient. An
        # internal/* import here would compile inside this repository and
        # break for every real external consumer.
        working-directory: examples
        run: |
          if grep -rn "github.com/Trustvian/trustvian/internal" --include="*.go" .; then
            echo "::error::examples must not import internal/* — they model an external consumer"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Release tooling: prove the artifact matrix still cross-compiles on
  # every change, so a broken target is found on the pull request that
  # breaks it rather than when a tag is pushed.
  #
  # This builds and discards. Nothing is uploaded and no release is
  # created — publishing happens only in release.yml, on a tag.
  # ---------------------------------------------------------------------
  release-dry-run:
    name: Release build (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release matrix
        run: ./scripts/release-build.sh

  # ---------------------------------------------------------------------
  # Official container image: prove it still builds on every change.
  #
  # Builds and discards — nothing is pushed and no registry credential is
  # used, which is why this job runs on fork pull requests like any other.
  # Publishing happens only in release.yml, on a tag.
  # ---------------------------------------------------------------------
  container-build:
    name: Container image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the official image
        # Single platform here: this job answers "does it still build", and
        # the multi-arch matrix is exercised by the release workflow. Keeping
        # it to one platform keeps pull-request feedback fast.
        run: docker buildx build --platform linux/amd64 -t trustvian-collector:ci .

  # ---------------------------------------------------------------------
  # Reference deployment: validate that the Compose configuration parses.
  # The full smoke test builds images and is scheduled nightly instead.
  # ---------------------------------------------------------------------
  deployment:
    name: Reference deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        working-directory: deployments/docker-compose
        run: docker compose config --quiet
