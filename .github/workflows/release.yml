# Tag-triggered release: validate the tag, re-run the quality gates against
# the tagged source, build the artifact matrix, and publish a GitHub
# Release with the binaries and their checksums attached.
#
# This workflow has never run. It was written and structurally validated by
# docs/tasks/040-release-artifacts-and-module-consistency.md, which
# deliberately publishes nothing; the first real execution is whenever a
# maintainer pushes the next version tag.
#
# Everything it builds can be built locally first — `make release-dry-run`
# runs the same script — so a broken target is found before a tag exists
# rather than after.
#
# The container job below extends this same release identity rather than
# forming a second one: it `needs` the release job, so the image is built
# from source whose tag was already validated and whose gates already
# passed. See docs/tasks/041-container-supply-chain-security.md
# § Release integration.

name: Release

on:
  push:
    tags:
      - "v*"

# Read by default. Only the publishing job widens this, and only to
# contents: write — the scope GitHub requires to create a release. No
# packages: write and no id-token: write; nothing here pushes an image or
# requests an OIDC token.
permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    services:
      # The same PostgreSQL service ci.yml uses, so the release gates cover
      # the persistence guarantees rather than skipping them.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          POSTGRES_PASSWORD: trustvian
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # github.ref is the tag, so this checks out the tagged commit —
          # never a branch head that may have moved since the tag was cut.
          ref: ${{ github.ref }}
          # Full history so `git describe` and tag verification work.
          fetch-depth: 0

      - name: Validate tag is SemVer
        env:
          # Through the environment, not string-interpolated into the
          # script body: a tag name is attacker-influenceable in principle,
          # and interpolation would make it executable shell.
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid SemVer release tag (want vMAJOR.MINOR.PATCH[-prerelease][+build])"
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Verify checkout matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Proving, not assuming, that the working tree is the tagged
          # commit — the difference between releasing what was reviewed and
          # releasing whatever main happened to hold.
          tagged="$(git rev-list -n 1 "refs/tags/$TAG")"
          head="$(git rev-parse HEAD)"
          if [ "$tagged" != "$head" ]; then
            echo "::error::HEAD ($head) is not the commit tagged $TAG ($tagged)"
            exit 1
          fi
          echo "HEAD is the tagged commit: $head"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # --- Quality gates, re-run against the exact tagged source ---------
      #
      # Not "some earlier workflow probably passed": that workflow ran on a
      # different commit, and a tag can be placed on anything.

      - name: Module consistency
        run: ./scripts/check-modules.sh

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Test with PostgreSQL
        env:
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:trustvian@localhost:5432/trustvian_test?sslmode=disable
        run: go test -race -short ./...

      - name: Processor module (GOWORK=off)
        env:
          GOWORK: "off"
        working-directory: processor
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      # --- Artifacts -----------------------------------------------------
      #
      # The same script a maintainer runs locally. Every target must build:
      # the script exits non-zero on the first failure, so the publish step
      # below never runs for a partial matrix.

      - name: Build release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-build.sh "$TAG"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      # --- Publish -------------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --verify-tag so the release cannot be created for a tag that
          # does not exist. Notes come from CHANGELOG.md via --notes-file
          # when a maintainer has prepared them; otherwise the release is
          # created as a draft for them to finish, rather than publishing
          # an auto-generated commit dump.
          notes_args=(--generate-notes)
          if [ -f "release-notes.md" ]; then
            notes_args=(--notes-file release-notes.md)
          fi

          gh release create "$TAG" \
            --title "Trustvian $TAG" \
            --verify-tag \
            --draft \
            "${notes_args[@]}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

          echo "::notice::Draft release created for $TAG. Review the notes against CHANGELOG.md, then publish it."

  # ---------------------------------------------------------------------
  # Official container image: build, scan, publish, sign, attest.
  #
  # Depends on the release job, so it inherits that job's verified tag and
  # passing gates instead of re-establishing trust in the source. One
  # release identity, two artifact kinds.
  #
  # Ordering is build -> scan -> gate -> push -> sign, so a known-bad image
  # is never published. Signing follows the push because Cosign signs a
  # digest, which exists only once the image is in the registry.
  # ---------------------------------------------------------------------
  container:
    name: Container image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read source; write packages to push to GHCR; id-token for keyless
      # Cosign signing. contents: write is deliberately absent — this job
      # does not touch GitHub Release state.
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/trustvian-collector

    steps:
      - uses: actions/checkout@v7
        with:
          # The tagged commit, exactly as the release job used. The image
          # and the binaries are built from the same source.
          ref: ${{ github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow-scoped token, not a stored PAT: nothing long-lived
          # to leak or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and scan before publishing ------------------------------

      - name: Build for scanning
        # Single platform and --load, because a multi-platform result cannot
        # be loaded into the local daemon for a scanner to read. The
        # multi-arch push below reuses this build's cache, so the pushed
        # amd64 layer is the artifact scanned here; see
        # docs/supply-chain.md § What the scan covers.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "$IMAGE:scan" \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL,HIGH
          # Only findings with a fix can be acted on by rebuilding; an
          # unfixed upstream advisory must not block shipping our own
          # security fixes. Policy and exceptions: docs/supply-chain.md.
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      # --- Publish -------------------------------------------------------

      - name: Tags for this release
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The immutable vX.Y.Z tag is the deployment contract and is
          # always published. The floating tags are convenience only, and a
          # prerelease must never move them — someone tracking `latest`
          # has not opted into release candidates.
          tags="$IMAGE:$TAG"
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            minor="${TAG#v}"; minor="${minor%.*}"
            tags="$tags,$IMAGE:$minor,$IMAGE:latest"
          else
            echo "::notice::prerelease $TAG — publishing only the immutable tag"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: push
        run: |
          IFS=',' read -ra tag_list <<< "${{ steps.tags.outputs.tags }}"
          tag_args=()
          for tg in "${tag_list[@]}"; do tag_args+=(-t "$tg"); done

          # BuildKit's own SBOM (SPDX) and SLSA provenance attestations,
          # attached to the image in the registry. Platform-standard rather
          # than a bespoke format, and no extra tool in the release path.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true \
            --provenance=mode=max \
            "${tag_args[@]}" \
            --metadata-file /tmp/metadata.json \
            --push \
            .

          digest="$(python3 -c "import json;print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed $IMAGE@$digest"

      # --- Sign ----------------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: identity comes from this workflow's OIDC token, so there
        # is no private key in the repository or in a secret. Signs the
        # digest rather than a tag, because a tag can later move.
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Summarize
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "$IMAGE:$TAG"
            echo "$IMAGE@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Signed keylessly; SBOM and SLSA provenance attached as attestations."
            echo "Verification: docs/supply-chain.md"
          } >> "$GITHUB_STEP_SUMMARY"
